name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  go:
    name: Go Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -race -count=1 ./...

      - name: Build server
        run: CGO_ENABLED=1 go build -ldflags="-s -w" -o bin/infrawatch-server ./cmd/server

      - name: Build agent
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/infrawatch-agent ./cmd/agent

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: web
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [go, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -t infrawatch-server .

      - name: Build agent image
        run: docker build -t infrawatch-agent -f Dockerfile.agent .
